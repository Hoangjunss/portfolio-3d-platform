name: Deploy

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Backend tests
        run: mvn -B -f backend/pom.xml test

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npx vitest run
          npm run build

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Require a non-empty PUBLIC_API_BASE_URL
        env:
          PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL }}
        # NEXT_PUBLIC_* is inlined at build time, and apiClient.ts uses `??` -- which does not
        # catch "". An unset secret therefore builds green and ships a landing page whose every
        # request is a relative URL against portfolio.com (AD-04).
        run: test -n "$PUBLIC_API_BASE_URL" || { echo "PUBLIC_API_BASE_URL secret is empty" >&2; exit 1; }

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          # NEXT_PUBLIC_* is inlined at build time (plan 15 decision (a)). Omitting this arg
          # bakes the localhost fallback into the client bundle and every visitor's browser
          # calls their own machine -- with no error anywhere in CI or in the container logs.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.PUBLIC_API_BASE_URL }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/frontend:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # Built here, not in a heredoc on the VPS. Secrets arrive as env vars and go out through
      # printf, so no shell ever parses their contents -- a password containing `$` used to reach
      # the VPS as a different string, with the same symptoms as a typo (AD-02). .gitignore
      # already covers .env.
      - name: Render .env
        env:
          IMAGE_TAG: ${{ github.sha }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          ANALYTICS_IP_HASH_SECRET: ${{ secrets.ANALYTICS_IP_HASH_SECRET }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : > .env
          for key in IMAGE_TAG DB_PASSWORD JWT_ACCESS_SECRET ANALYTICS_IP_HASH_SECRET \
                     NEXT_PUBLIC_API_BASE_URL SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASSWORD; do
            printf '%s=%s\n' "$key" "${!key-}" >> .env
          done

      - name: Copy compose file, deploy script and .env to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,deploy/deploy.sh,.env"
          target: /opt/portfolio-3d-platform

      - name: Run the deploy script
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /opt/portfolio-3d-platform
            bash deploy/deploy.sh
