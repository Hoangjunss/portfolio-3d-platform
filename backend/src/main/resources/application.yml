server:
  port: 8080
  # N-01: behind Nginx, getRemoteAddr() is the proxy's container IP, so every client in the world
  # would share one rate-limit bucket. Safe only because nginx overwrites X-Forwarded-For with
  # $remote_addr rather than appending to what the client sent -- see nginx/conf.d/api.conf.
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portfolio}
    username: ${DB_USER:portfolio}
    password: ${DB_PASSWORD:portfolio}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    web:
      pageable:
        # @PageableDefault only sets the default size, not a ceiling. Spring's own ceiling is
        # 2000, so ?size=100000 still returned 2000 rows — on leads, which grows with visitor
        # traffic and stores a 5000-character message per row, that is megabytes per request
        # against a 350MB heap.
        max-page-size: 100
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          # JavaMail defaults to no timeout at all. POST /api/public/leads is unauthenticated and
          # sends this mail inside the request thread, so an SMTP host that accepts the connection
          # and then hangs would pin a thread — and its DB connection — forever.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      # Must stay >= media.max-size-bytes, otherwise MediaServiceImpl's own size check is
      # unreachable and the real limit surfaces as a multipart parse failure instead.
      max-file-size: 10MB
      max-request-size: 11MB

jwt:
  access-secret: ${JWT_ACCESS_SECRET:dev-only-access-secret-change-me-32bytes}
  access-ttl-minutes: 15
  refresh-ttl-days: 7

auth:
  max-refresh-tokens-per-user: 5

media:
  upload-dir: ${MEDIA_UPLOAD_DIR:/data/media}
  max-size-bytes: 10485760
  allowed-content-types:
    - image/png
    - image/jpeg
    - image/webp
    - image/gif

notification:
  lead-recipient: ${LEAD_RECIPIENT_EMAIL:sales@portfolio.com}
  from: ${MAIL_FROM:no-reply@portfolio.com}

analytics:
  ip-hash-secret: ${ANALYTICS_IP_HASH_SECRET:dev-only-analytics-secret-change-me}

rate-limit:
  paths:
    "[/api/auth/login]":
      capacity: 10
      window: 15m
    "[/api/public/leads]":
      capacity: 5
      window: 1h
    "[/api/analytics/events]":
      capacity: 120
      window: 1m
